<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearWire | Standalone Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  
  <!-- Navigation -->
  <nav class="bg-slate-900 text-white p-4 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-2 font-bold text-xl tracking-tight">
      <i data-lucide="shield-check" class="text-blue-400"></i>
      <span>ClearWire</span>
    </div>
    <div class="text-sm font-medium text-slate-300">Demo Mode</div>
  </nav>

  <!-- Main Container -->
  <main class="p-4 md:p-8 max-w-5xl mx-auto" id="app-container">
    <!-- View 1: Dashboard (Injected via JS) -->
  </main>

  <script>
    // Initialize icons
    lucide.createIcons();

    // Mock Data
    const MOCK_DATA = [
      { id: "REQ-001", vendor: "Foxconn Electronics", amount: 145000, status: "Approved", date: "2026-05-20" },
      { id: "REQ-002", vendor: "AWS Web Services", amount: 24000, status: "Pending", date: "2026-05-20" },
    ];

    function renderDashboard() {
      const container = document.getElementById('app-container');
      
      let rowsHtml = MOCK_DATA.map(req => `
        <tr class="hover:bg-slate-50 border-b border-slate-100">
          <td class="px-6 py-4 font-mono text-slate-500">${req.id}</td>
          <td class="px-6 py-4 font-medium text-slate-900">${req.vendor}</td>
          <td class="px-6 py-4 text-slate-900">$${req.amount.toLocaleString()}</td>
          <td class="px-6 py-4 text-slate-500">${req.date}</td>
          <td class="px-6 py-4">
            ${req.status === 'Approved' 
              ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800"><i data-lucide="check-circle-2" class="w-3 h-3"></i> Approved</span>`
              : `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-100 text-amber-800"><i data-lucide="clock" class="w-3 h-3"></i> Pending</span>`
            }
          </td>
          <td class="px-6 py-4 text-right">
            ${req.status === 'Pending' 
              ? `<button onclick="renderApprovalScreen('${req.id}', '${req.vendor}', ${req.amount})" class="text-blue-600 hover:text-blue-800 text-sm font-medium underline">Simulate CFO Device</button>`
              : `<span class="text-slate-300">-</span>`
            }
          </td>
        </tr>
      `).join('');

      container.innerHTML = `
        <div class="fade-in space-y-6">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">AP Clerk Dashboard</h1>
              <p class="text-slate-500 text-sm mt-1">Manage outbound wires and cryptographically verify approvals.</p>
            </div>
            <button onclick="alert('In the full app, this opens a form to enter new wire details.')" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2 shadow-sm">
              <i data-lucide="plus" class="w-4 h-4"></i> New Wire Request
            </button>
          </div>
          
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-sm text-left">
                <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-medium">
                  <tr>
                    <th class="px-6 py-4">Request ID</th>
                    <th class="px-6 py-4">Vendor</th>
                    <th class="px-6 py-4">Amount</th>
                    <th class="px-6 py-4">Date</th>
                    <th class="px-6 py-4">Status</th>
                    <th class="px-6 py-4 text-right">Action</th>
                  </tr>
                </thead>
                <tbody>
                  ${rowsHtml}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function renderApprovalScreen(id, vendor, amount) {
      const container = document.getElementById('app-container');
      
      container.innerHTML = `
        <div class="fade-in max-w-md mx-auto mt-6 bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
          
          <button onclick="renderDashboard()" class="absolute top-20 left-4 text-slate-500 text-sm flex items-center gap-1 hover:text-slate-900">
            &larr; Back to Dashboard
          </button>

          <div class="bg-slate-900 text-white p-6 text-center relative mt-8">
            <div class="absolute top-4 right-4 flex items-center gap-1 text-xs font-semibold text-emerald-400 bg-emerald-400/10 px-2 py-1 rounded-full">
              <i data-lucide="lock" class="w-3 h-3"></i> E2E Encrypted
            </div>
            <i data-lucide="shield-check" class="w-12 h-12 mx-auto text-blue-400 mb-3"></i>
            <h1 class="text-xl font-bold tracking-tight">Authorization Required</h1>
            <p class="text-slate-300 text-sm mt-1">Out-of-band wire verification</p>
          </div>

          <div class="p-6 space-y-6">
            <div class="space-y-3">
              <div class="flex justify-between items-end border-b border-slate-100 pb-3">
                <span class="text-sm text-slate-500">Pay To</span>
                <span class="font-semibold text-slate-900 text-right">${vendor}</span>
              </div>
              <div class="flex justify-between items-end border-b border-slate-100 pb-3">
                <span class="text-sm text-slate-500">Amount</span>
                <span class="text-2xl font-bold text-slate-900 tracking-tight">$${amount.toLocaleString()}</span>
              </div>
            </div>

            <div class="bg-amber-50 border border-amber-200 rounded-lg p-4">
              <div class="flex items-start gap-3">
                <i data-lucide="alert-triangle" class="text-amber-600 shrink-0 mt-0.5 w-5 h-5"></i>
                <div>
                  <h4 class="text-sm font-semibold text-amber-900">Anti-Deepfake Liveness Check</h4>
                  <p class="text-xs text-amber-700 mt-1 mb-2">
                    High-value wires require vocal confirmation. Read this phrase aloud if on a video call:
                  </p>
                  <div class="bg-white px-3 py-2 rounded border border-amber-200 font-mono text-center font-bold text-slate-800 tracking-wider">
                    PURPLE ELEPHANT BATTERY
                  </div>
                </div>
              </div>
            </div>

            <button id="auth-btn" onclick="simulateAuth('${id}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl py-4 flex flex-col items-center justify-center gap-1 transition-all shadow-md shadow-blue-600/20">
              <div class="flex items-center gap-2 font-semibold text-lg">
                <i data-lucide="fingerprint" class="w-5 h-5"></i>
                Sign with Passkey (FaceID)
              </div>
              <span class="text-xs text-blue-200 font-medium">Cryptographically secure signature</span>
            </button>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function simulateAuth(id) {
      const btn = document.getElementById('auth-btn');
      btn.innerHTML = `<span class="animate-pulse font-semibold text-lg">Verifying Biometrics...</span>`;
      btn.classList.add('opacity-75');
      btn.disabled = true;

      // Simulate network / biometric delay
      setTimeout(() => {
        // Update mock data status
        const reqIndex = MOCK_DATA.findIndex(r => r.id === id);
        if(reqIndex > -1) MOCK_DATA[reqIndex].status = "Approved";
        
        const container = document.getElementById('app-container');
        container.innerHTML = `
          <div class="fade-in max-w-md mx-auto mt-10 bg-white p-8 rounded-2xl shadow-sm border border-emerald-200 text-center">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="check-circle" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Cryptographically Signed</h2>
            <p class="text-slate-500 mb-6">
              The wire has been securely authorized. A PDF certificate has been sent to the AP dashboard.
            </p>
            <div class="bg-slate-50 p-4 rounded-lg font-mono text-xs text-slate-500 break-all text-left border border-slate-200 mb-6">
              HASH: 0x9f86d081884c7d659a2feaa0c55ad015a3bf4f1b<br/>
              DEVICE: Apple iPhone (FaceID)<br/>
              TIME: ${new Date().toISOString()}
            </div>
            <button onclick="renderDashboard()" class="text-blue-600 font-medium hover:underline">Return to Dashboard</button>
          </div>
        `;
        lucide.createIcons();
      }, 1500);
    }

    // Start app
    renderDashboard();
  </script>
</body>
</html>
